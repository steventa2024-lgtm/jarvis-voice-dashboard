<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About — {name}</title>
<meta name="description" content="Who we are">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container between">
    <strong><a href="index.html" style="color:inherit;text-decoration:none">{name}</a></strong>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="work.html">Work</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="section narrow stack-lg">
    <div class="stack"><p class="eyebrow">About</p><h1>Who is behind this</h1></div>
    <p class="lead">Two or three sentences. What you do, how long you have done
       it, and the thing that makes you the obvious choice.</p>
    <div class="grid on-scroll">
      <div class="stack"><h3>Founded</h3><p class="muted">2026</p></div>
      <div class="stack"><h3>Based</h3><p class="muted">Somewhere real</p></div>
      <div class="stack"><h3>Focus</h3><p class="muted">One thing, done well</p></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container between">
    <span>&copy; <span id="year"></span> {name}</span>
    <span class="muted">Built locally</span>
  </div>
</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script src="base.js"></script>
</body>
</html>
